services:
  postgres:
    image: postgres:16
    container_name: agentscope-postgres
    environment:
      POSTGRES_DB: agentscope
      POSTGRES_USER: agentscope
      POSTGRES_PASSWORD: agentscope
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U agentscope -d agentscope" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/agentscope
      DB_USERNAME: agentscope
      DB_PASSWORD: agentscope
      RUNTIME_BASE_URL: http://runtime:8000
    depends_on:
      postgres:
        condition: service_healthy

  runtime:
    build: ./runtime
    ports:
      - "8000:8000"
    environment:
      BACKEND_URL: http://backend:8080
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:4b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_WS_URL: ws://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
