spring.application.name=agentscope-backend
server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agentscope}
spring.datasource.username=${DB_USERNAME:agentscope}
spring.datasource.password=${DB_PASSWORD:agentscope}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Runtime base URL
runtime.base-url=${RUNTIME_BASE_URL:http://localhost:8000}

# Logging
logging.level.com.agentscope=INFO
